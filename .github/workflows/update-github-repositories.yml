name: Update GitHub repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-repositories:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get group repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          mkdir -p docs/_data

          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/multimorbidity-research-leeds/repos?per_page=100&type=sources&sort=updated" \
            -o repositories.json

          echo "===== GitHub API response ====="
          cat repositories.json
          echo "===== End response ====="

      - name: Check GitHub response
        run: |

          python - <<'PY'

          import json

          with open("repositories.json", "r") as f:
              data = json.load(f)

          if not isinstance(data, list):
              print("")
              print("ERROR: GitHub did not return a list of repositories.")
              print("")
              print("GitHub returned:")
              print(data)
              print("")
              raise SystemExit(1)

          print("")
          print("SUCCESS: GitHub returned", len(data), "repositories.")
          print("")

          PY

      - name: Create repository data file
        run: |

          python - <<'PY'

          import json

          with open("repositories.json", "r") as f:
              repositories = json.load(f)

          with open("docs/_data/github_repositories.yml", "w") as f:

              for repo in repositories:

                  name = repo.get("name", "")
                  url = repo.get("html_url", "")
                  description = repo.get("description") or ""
                  language = repo.get("language") or ""

                  name = name.replace('"', '\\"')
                  url = url.replace('"', '\\"')
                  description = description.replace('"', '\\"')
                  language = language.replace('"', '\\"')

                  f.write("- name: \"" + name + "\"\n")
                  f.write("  url: \"" + url + "\"\n")
                  f.write("  description: \"" + description + "\"\n")
                  f.write("  language: \"" + language + "\"\n")

          PY

      - name: Commit updated repository list
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/_data/github_repositories.yml

          git diff --cached --quiet || git commit -m "Update GitHub repositories"

          git push